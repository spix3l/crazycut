name: release

on:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Derive version from tag
        run: echo "CC_APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Package macOS app
        run: bash tools/package-macos.sh
        env:
          CC_SIGN_IDENTITY: ${{ secrets.CC_SIGN_IDENTITY }}
          CC_NOTARY_PROFILE: ${{ secrets.CC_NOTARY_PROFILE }}
      - uses: actions/upload-artifact@v4
        with:
          name: CrazyCut-macOS
          path: dist/CrazyCut.dmg

  windows:
    runs-on: windows-2022
    env:
      FFMPEG_DIR: ${{ github.workspace }}\ffmpeg
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fetch ffmpeg shared dev build
        shell: pwsh
        run: |
          curl.exe -L -o ffmpeg.7z https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z
          7z x ffmpeg.7z -offf -y
          $dir = Get-ChildItem offf -Directory | Select-Object -First 1
          Move-Item $dir.FullName ffmpeg
      - name: Derive version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "CC_APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Package Windows app
        shell: pwsh
        run: ./tools/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CrazyCut-Windows
          path: dist/CrazyCut-Windows.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CrazyCut-macOS/CrazyCut.dmg
            dist/CrazyCut-Windows/CrazyCut-Windows.zip
          generate_release_notes: true
          draft: false
