# yaml-language-server: $schema=https://raw.githubusercontent.com/dart-lang/native/main/pkgs/ffigen/ffigen.schema.json
name: CrazyCutNativeBindings
description: Generated bindings for CrazyCut's stable C ABI.
output: lib/engine/crazycut_bindings_generated.dart
headers:
  entry-points:
    - ../engine/bindings/crazycut.h
  include-directives:
    - ../engine/bindings/crazycut.h
functions:
  include:
    - 'cc_.*'
structs:
  include:
    - 'cc_.*'
typedefs:
  include:
    - 'cc_.*'
macros:
  include:
    - CC_ABI_VERSION
preamble: |
  // AUTO-GENERATED by ffigen from engine/bindings/crazycut.h.
  // Regenerate from the repository root with: bash tools/generate-bindings.sh
  // ignore_for_file: type=lint
